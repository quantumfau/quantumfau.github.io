name: Update news page
on:
  schedule:
    - cron: "17 11 * * *"   # every day ~7:17 AM Eastern
  workflow_dispatch:         # "Run workflow" button on GitHub
permissions:
  contents: write
  pages: write
concurrency: news
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: fetch
        run: python3 _tools/news.py fetch
      - if: steps.fetch.outputs.added != '0'
        name: Rebuild site and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./_build.sh
          git config user.name "QDC news bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "News: add ${{ steps.fetch.outputs.added }} new FAU quantum stor(ies)"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
